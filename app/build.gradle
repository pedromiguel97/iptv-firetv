plugins {
    id 'com.android.application'
}

android {
    namespace 'br.tvaberta'
    compileSdk 34

    defaultConfig {
        applicationId 'br.tvaberta'
        minSdk 22          // Fire OS 5 (Fire TV Stick antigos) em diante
        targetSdk 34
        // cada build no GitHub vira uma versão nova, então dá pra atualizar por cima
        versionCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer
        versionName = "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    signingConfigs {
        // chave fixa guardada no repositório: permite instalar versões novas por cima da antiga
        tvaberta {
            storeFile file('tvaberta.keystore')
            storePassword 'tvaberta'
            keyAlias 'tvaberta'
            keyPassword 'tvaberta'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.tvaberta
        }
    }

    lint {
        checkReleaseBuilds false   // app pessoal: não travar o build por avisos de lint
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
